<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="True PBL — project-based math learning, classroom games, and Geotopia adventures." />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <title>TruePBL by XDY</title>

  <style>
    :root {
      --fade-to-black: 500ms;
      --fade-from-black: 350ms;
      --reveal-speed: 280ms;
      --footer-height: 92px;
    }

    * { box-sizing: border-box; }

    html {
      width: 100%;
      min-height: 100%;
      margin: 0;
      overflow-x: hidden;
      overflow-y: auto;
      background: #000;
    }

    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      overflow: visible;
      background: #000;
      font-family: Arial, Helvetica, sans-serif;
    }

    #pageRoot {
      width: 100%;
      min-height: 100%;
    }

    button,
    a { -webkit-tap-highlight-color: transparent; }

    .site-page {
      display: none;
      width: 100%;
      min-height: 100svh;
      overflow: visible;
      background: #000;
    }

    .site-page.active { display: block; }

    .page-panel {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      background: #000;
      isolation: isolate;
    }

    .stage {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    .panel-art {
      position: absolute;
      inset: 0;
      z-index: 1;
      width: 100%;
      height: 100%;
      display: block;
      object-fit: fill;
      user-select: none;
      pointer-events: none;
    }

    .hotspot,
    .reveal-card,
    .video-button {
      position: absolute;
      z-index: 8;
      display: block;
      padding: 0;
      border: 0;
      border-radius: 10px;
      background: transparent;
      cursor: pointer;
      text-decoration: none;
    }

    .hotspot:hover,
    .hotspot:focus-visible,
    .video-button:hover,
    .video-button:focus-visible {
      outline: 3px solid rgba(255, 255, 255, 0.88);
      outline-offset: -3px;
      background: rgba(255, 255, 255, 0.07);
    }

    /*
      Visible Back to home button used on the first section of Pages 2–4.
      "Geomini" is used when available, with safe fallbacks.
    */
    /*
      Shared visible border for the top-left button on Pages 1–4.
    */
    .top-left-nav {
      border: 2px solid rgba(128, 128, 128, 0.92) !important;
      border-radius: 8px;
    }

    /*
      Visible Back to home button used on the first section of Pages 2–4.
      The text is black at 50% opacity.
    */
    .home-return {
      display: flex;
      align-items: center;
      justify-content: center;
      color: #000;
      font-family: "Geomini", "Gemini Light", "Avenir Next", "Helvetica Neue", Arial, sans-serif;
      font-size: clamp(10px, 0.78vw, 15px);
      font-weight: 700;
      line-height: 1.08;
      letter-spacing: 0.01em;
      text-align: center;
      white-space: pre-line;
    }

    .home-return:hover,
    .home-return:focus-visible {
      color: #000;
      outline: none;
      background: rgba(255, 255, 255, 0.12);
    }

    .show-hitboxes .hotspot,
    .show-hitboxes .video-button,
    .show-hitboxes .reveal-card {
      outline: 3px solid #ff2d55 !important;
      background: rgba(255, 45, 85, 0.14) !important;
    }

    .background-video {
      position: absolute;
      z-index: 4;
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      object-fit: contain;
      background: transparent;
      pointer-events: none;
      user-select: none;
    }

    .inline-youtube {
      position: absolute;
      z-index: 5;
      overflow: hidden;
      background: #000;
    }

    .inline-youtube iframe {
      width: 100%;
      height: 100%;
      display: block;
      border: 0;
    }

    .reveal-card {
      overflow: hidden;
      border-radius: 0;
    }

    .reveal-card:focus-visible {
      outline: 4px solid rgba(255, 255, 255, 0.94);
      outline-offset: -4px;
    }

    .reveal-image {
      width: 100%;
      height: 100%;
      display: block;
      border-radius: 0;
      object-fit: cover;
      opacity: 0;
      transform: translateY(105%);
      transition:
        transform var(--reveal-speed) cubic-bezier(0.22, 0.85, 0.35, 1),
        opacity 150ms ease-out;
      pointer-events: none;
      user-select: none;
    }

    .reveal-card:hover .reveal-image,
    .reveal-card:focus-visible .reveal-image {
      opacity: 1;
      transform: translateY(0);
    }

    .site-footer {
      min-height: var(--footer-height);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: #050505;
      color: #fff;
      text-align: center;
      font-family: "Gemini Light", "Avenir Next", "Helvetica Neue", Arial, sans-serif;
      font-size: clamp(16px, 1.25vw, 24px);
      font-weight: 300;
      letter-spacing: 0.02em;
    }

    .construction-page {
      position: relative;
      overflow: visible;
      color: #fff;
      background:
        radial-gradient(circle at 25% 25%, rgba(255, 216, 104, 0.24), transparent 34%),
        radial-gradient(circle at 75% 70%, rgba(115, 183, 255, 0.20), transparent 36%),
        #090909;
    }

    .construction-content {
      min-height: calc(100svh - var(--footer-height));
      display: grid;
      place-items: center;
      padding: 28px;
      text-align: center;
    }

    .construction-card {
      width: min(760px, 92vw);
      padding: clamp(32px, 6vw, 72px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 28px;
      background: rgba(0, 0, 0, 0.58);
      box-shadow: 0 25px 80px rgba(0, 0, 0, 0.40);
      backdrop-filter: blur(12px);
    }

    .construction-card h1 {
      margin: 0 0 14px;
      font-size: clamp(36px, 7vw, 82px);
      line-height: 1;
    }

    .construction-card h2 {
      margin: 0 0 14px;
      color: #ffdd68;
      font-size: clamp(20px, 3vw, 34px);
      font-weight: 600;
    }

    .construction-card p {
      max-width: 560px;
      margin: 0 auto 28px;
      color: rgba(255, 255, 255, 0.78);
      font-size: clamp(16px, 2vw, 22px);
      line-height: 1.55;
    }

    .back-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 190px;
      min-height: 54px;
      padding: 14px 26px;
      border: 0;
      border-radius: 999px;
      background: #ffdd68;
      color: #111;
      font: inherit;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
    }

    .back-button:hover,
    .back-button:focus-visible {
      outline: none;
      transform: translateY(-2px);
      box-shadow: 0 10px 28px rgba(255, 221, 104, 0.25);
    }

    #pageFade {
      position: fixed;
      inset: 0;
      z-index: 9500;
      background: #000;
      opacity: 0;
      pointer-events: none;
      transition: opacity var(--fade-from-black) ease;
    }

    #pageFade.fade-in {
      opacity: 1;
      pointer-events: all;
      transition-duration: var(--fade-to-black);
    }

    #videoModal {
      position: fixed;
      inset: 0;
      z-index: 9700;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 28px;
      background: rgba(0, 0, 0, 0.70);
    }

    #videoModal.open { display: flex; }

    .video-dialog {
      position: relative;
      width: min(960px, 86vw);
      aspect-ratio: 16 / 9;
      overflow: visible;
      border-radius: 14px;
      background: #000;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.58);
    }

    .video-dialog iframe {
      width: 100%;
      height: 100%;
      display: block;
      border: 0;
      border-radius: 14px;
      background: #000;
    }

    .video-close {
      position: absolute;
      top: -18px;
      right: -18px;
      width: 44px;
      height: 44px;
      border: 2px solid rgba(255, 255, 255, 0.68);
      border-radius: 50%;
      background: #111;
      color: #fff;
      font-size: 27px;
      line-height: 1;
      cursor: pointer;
    }

    .video-close:hover,
    .video-close:focus-visible {
      background: #292929;
      outline: 3px solid rgba(255, 255, 255, 0.88);
    }

    #rotatePrompt {
      position: fixed;
      inset: 0;
      z-index: 9900;
      display: none;
      place-items: center;
      padding: 30px;
      background: #080808;
      color: #fff;
      text-align: center;
    }

    #rotatePrompt.show { display: grid; }

    .rotate-message { max-width: 430px; }

    .phone-icon {
      position: relative;
      width: 78px;
      height: 126px;
      margin: 0 auto 26px;
      border: 5px solid #ffdd68;
      border-radius: 14px;
      animation: rotate-phone 1.8s ease-in-out infinite;
    }

    .phone-icon::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: 8px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #ffdd68;
      transform: translateX(-50%);
    }

    .rotate-message h2 {
      margin: 0 0 12px;
      font-size: clamp(28px, 8vw, 44px);
    }

    .rotate-message p {
      margin: 0;
      color: rgba(255, 255, 255, 0.78);
      font-size: 18px;
      line-height: 1.5;
    }

    @keyframes rotate-phone {
      0%, 22%   { transform: rotate(0deg); }
      60%, 100% { transform: rotate(90deg); }
    }

    @media (max-width: 700px) {
      #videoModal { padding: 14px; }
      .video-dialog { width: 94vw; }
      .video-close { top: -13px; right: -8px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
      }
    }
  </style>
</head>

    function percent(value, total) {
      return `${(value / total) * 100}%`;
    }

    function place(element, box) {
      element.style.left = percent(box.x, 1920);
      element.style.top = percent(box.y, 1080);
      element.style.width = percent(box.w, 1920);
      element.style.height = percent(box.h, 1080);
    }

    function extractYouTubeData(url) {
      try {
        const parsed = new URL(url);
        let id = "";

        if (parsed.hostname.includes("youtu.be")) {
          id = parsed.pathname.replace("/", "");
        } else if (parsed.pathname.startsWith("/embed/")) {
          id = parsed.pathname.split("/embed/")[1].split("/")[0];
        } else {
          id = parsed.searchParams.get("v") || "";
        }

        let start = 0;
        const startParam = parsed.searchParams.get("start");
        const timeParam = parsed.searchParams.get("t");

        if (startParam) {
          start = Number.parseInt(startParam, 10) || 0;
        } else if (timeParam) {
          if (/^\d+$/.test(timeParam)) {
            start = Number.parseInt(timeParam, 10);
          } else {
            const hours = Number.parseInt((timeParam.match(/(\d+)h/) || [0, 0])[1], 10);
            const minutes = Number.parseInt((timeParam.match(/(\d+)m/) || [0, 0])[1], 10);
            const seconds = Number.parseInt((timeParam.match(/(\d+)s/) || [0, 0])[1], 10);
            start = hours * 3600 + minutes * 60 + seconds;
          }
        }

        return { id, start };
      } catch {
        return { id: "", start: 0 };
      }
    }

    function youtubeEmbedUrl(url, autoplay = false) {
      const { id, start } = extractYouTubeData(url);

      /*
        Error 153 is caused when YouTube cannot identify the embedding client.
        When the site is online, use the actual site origin and page URL.
        During a downloaded file preview, identify the future GitHub Pages site.
      */
      const isOnlinePage = /^https?:$/.test(window.location.protocol);
      const playerOrigin = isOnlinePage ? window.location.origin : DEPLOYED_ORIGIN;
      const widgetReferrer = isOnlinePage
        ? window.location.href.split("#")[0]
        : DEPLOYED_PAGE;

      const params = new URLSearchParams({
        rel: "0",
        playsinline: "1",
        enablejsapi: "1",
        origin: playerOrigin,
        widget_referrer: widgetReferrer
      });

      if (autoplay) params.set("autoplay", "1");
      if (start > 0) params.set("start", String(start));

      return `https://www.youtube.com/embed/${id}?${params.toString()}`;
    }

    function googleDriveFileId(url) {
      const match = String(url).match(/\/file\/d\/([^/]+)/);
      return match ? match[1] : "";
    }

    function googleDriveEmbedUrl(url) {
      const fileId = googleDriveFileId(url);
      return `https://drive.google.com/file/d/${fileId}/preview`;
    }

    function modalEmbedUrl(url) {
      return String(url).includes("drive.google.com")
        ? googleDriveEmbedUrl(url)
        : youtubeEmbedUrl(url, true);
    }

    function createHotspot(item) {
      let element;

      if (item.drive || item.youtube) {
        element = document.createElement("button");
        element.type = "button";
        element.className = "video-button";
        element.addEventListener("click", () => openVideoModal(item.drive || item.youtube));
      } else {
        element = document.createElement("a");
        element.className = "hotspot";

        if (item.url) {
          element.href = item.url;
          element.target = "_blank";
          element.rel = "noopener noreferrer";
        } else if (item.route) {
          element.href = `#${item.route}`;
          element.addEventListener("click", (event) => {
            event.preventDefault();
            navigateTo(item.route, true);
          });
        }
      }

      if (item.className) {
        item.className
          .split(/\s+/)
          .filter(Boolean)
          .forEach((className) => element.classList.add(className));
      }

      if (item.text) {
        element.textContent = item.text;
      }

      element.setAttribute("aria-label", item.label || "Open link");
      place(element, item);
      return element;
    }

    function createReveal(item) {
      const card = document.createElement("button");
      card.type = "button";
      card.className = "reveal-card";
      card.setAttribute("aria-label", item.label || "Show preview");
      place(card, item);

      const image = document.createElement("img");
      image.className = "reveal-image";
      image.src = item.image;
      image.alt = "";
      image.draggable = false;
      image.loading = "lazy";
      card.appendChild(image);

      card.addEventListener("click", (event) => event.preventDefault());
      card.addEventListener("pointerleave", () => card.blur());
      return card;
    }

    function createSection(section, sectionIndex, pageName) {
      const panel = document.createElement("section");
      panel.className = "page-panel";
      panel.setAttribute("aria-label", `${pageName} section ${sectionIndex + 1}`);

      const stage = document.createElement("div");
      stage.className = "stage";

      const art = document.createElement("img");
      art.className = "panel-art";
      art.src = section.image;
      art.alt = `${pageName} section ${sectionIndex + 1}`;
      art.draggable = false;
      art.loading = sectionIndex < 2 ? "eager" : "lazy";
      if (sectionIndex === 0) art.fetchPriority = "high";
      stage.appendChild(art);

      if (section.loopingVideo) {
        const video = document.createElement("video");
        video.className = "background-video";
        video.src = section.loopingVideo.src;
        video.autoplay = true;
        video.muted = true;
        video.loop = true;
        video.playsInline = true;
        video.preload = "metadata";
        video.disablePictureInPicture = true;
        video.setAttribute("controlsList", "nodownload nofullscreen noplaybackrate");
        video.setAttribute("aria-hidden", "true");
        video.tabIndex = -1;
        place(video, section.loopingVideo);
        stage.appendChild(video);
      }

      const inlinePlayer = section.inlineDrive || section.inlineYoutube;

      if (inlinePlayer) {
        const playerWindow = document.createElement("div");
        playerWindow.className = "inline-youtube";
        place(playerWindow, inlinePlayer);

        const iframe = document.createElement("iframe");
        iframe.src = section.inlineDrive
          ? googleDriveEmbedUrl(inlinePlayer.drive)
          : youtubeEmbedUrl(inlinePlayer.youtube, false);
        iframe.title = `${pageName} video`;
        iframe.loading = "lazy";
        iframe.referrerPolicy = "strict-origin-when-cross-origin";
        iframe.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share";
        iframe.allowFullscreen = true;
        playerWindow.appendChild(iframe);
        stage.appendChild(playerWindow);
      }

      (section.reveals || []).forEach((item) => stage.appendChild(createReveal(item)));
      (section.hotspots || []).forEach((item) => stage.appendChild(createHotspot(item)));

      panel.appendChild(stage);
      return panel;
    }

    function createConstructionPage(route, definition) {
      const page = document.createElement("section");
      page.className = "site-page construction-page";
      page.dataset.route = route;

      const wrapper = document.createElement("div");
      wrapper.className = "construction-content";

      const card = document.createElement("div");
      card.className = "construction-card";
      card.innerHTML = `
        <h2>${definition.title}</h2>
        <h1>Under Construction</h1>
        <p>This section is being built and will be available soon.</p>
      `;

      const button = document.createElement("button");
      button.type = "button";
      button.className = "back-button";
      button.textContent = "Back to Homepage";
      button.addEventListener("click", () => navigateTo("home", true));
      card.appendChild(button);

      wrapper.appendChild(card);
      page.appendChild(wrapper);

      const footer = document.createElement("footer");
      footer.className = "site-footer";
      footer.textContent = COPYRIGHT;
      page.appendChild(footer);

      return page;
    }

    function createPage(route, definition) {
      if (definition.construction) return createConstructionPage(route, definition);

      const page = document.createElement("section");
      page.className = "site-page";
      page.dataset.route = route;
      page.setAttribute("aria-label", definition.title);

      definition.sections.forEach((section, index) => {
        page.appendChild(createSection(section, index, definition.title));
      });

      const footer = document.createElement("footer");
      footer.className = "site-footer";
      footer.textContent = COPYRIGHT;
      page.appendChild(footer);
      return page;
    }

    Object.entries(pages).forEach(([route, definition]) => {
      pageRoot.appendChild(createPage(route, definition));
    });

    function getPageElement(route) {
      return document.querySelector(`.site-page[data-route="${route}"]`);
    }

    function closeVideoModal() {
      if (!videoModal.classList.contains("open")) return;
      videoModal.classList.remove("open");
      modalVideoFrame.src = "";
      document.body.style.overflow = "";
    }

    function observeLoopingVideos() {
      if (videoObserver) videoObserver.disconnect();

      videoObserver = new IntersectionObserver(
        (entries) => {
          entries.forEach((entry) => {
            const video = entry.target;
            if (entry.isIntersecting) video.play().catch(() => {});
            else video.pause();
          });
        },
        { threshold: 0.20 }
      );

      document.querySelectorAll(".site-page.active .background-video").forEach((video) => {
        videoObserver.observe(video);
      });
    }

    function showRoute(route) {
      const validRoute = pages[route] ? route : "home";

      document.querySelectorAll(".site-page").forEach((page) => {
        page.classList.toggle("active", page.dataset.route === validRoute);
      });

      currentRoute = validRoute;
      document.title =
        validRoute === "home"
          ? "TruePBL by XDY"
          : `${pages[validRoute].title} | TruePBL by XDY`;

      window.scrollTo({ top: 0, left: 0, behavior: "auto" });

      closeVideoModal();
      observeLoopingVideos();
    }

    function wait(milliseconds) {
      return new Promise((resolve) => setTimeout(resolve, milliseconds));
    }

    function safelyUpdateHistory(route, pushHistory) {
      /*
        Local file previews and some sandboxed editors treat file: pages as
        unique security origins. Avoiding History API writes there prevents
        the unsafe file-URL warning. GitHub Pages still gets normal hashes.
      */
      if (!pushHistory || !/^https?:$/.test(window.location.protocol)) return;
      history.pushState({ route }, "", `#${route}`);
    }

    async function navigateTo(route, pushHistory) {
      const validRoute = pages[route] ? route : "home";
      if (transitionRunning) return;

      if (validRoute === currentRoute) {
        window.scrollTo({ top: 0, left: 0, behavior: "smooth" });
        return;
      }

      transitionRunning = true;
      pageFade.classList.add("fade-in");
      await wait(500);

      showRoute(validRoute);
      safelyUpdateHistory(validRoute, pushHistory);

      requestAnimationFrame(() => {
        requestAnimationFrame(() => pageFade.classList.remove("fade-in"));
      });

      await wait(375);
      transitionRunning = false;
    }

    function initialRoute() {
      const hashRoute = location.hash.replace("#", "").trim();
      return pages[hashRoute] ? hashRoute : "home";
    }

    window.addEventListener("popstate", () => navigateTo(initialRoute(), false));
    showRoute(initialRoute());

    function openVideoModal(videoUrl) {
      modalVideoFrame.src = modalEmbedUrl(videoUrl);
      videoModal.classList.add("open");
      document.body.style.overflow = "hidden";
      videoClose.focus();
    }

    videoClose.addEventListener("click", closeVideoModal);
    videoModal.addEventListener("click", (event) => {
      if (event.target === videoModal) closeVideoModal();
    });
    window.addEventListener("keydown", (event) => {
      if (event.key === "Escape") closeVideoModal();
    });

    function isLikelyPhone() {
      if (navigator.userAgentData && typeof navigator.userAgentData.mobile === "boolean") {
        return navigator.userAgentData.mobile;
      }
      return /Android|iPhone|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
    }

    function updateRotatePrompt() {
      const portrait = window.innerHeight > window.innerWidth;
      rotatePrompt.classList.toggle("show", isLikelyPhone() && portrait);
    }

    window.addEventListener("resize", updateRotatePrompt);
    window.addEventListener("orientationchange", updateRotatePrompt);
    updateRotatePrompt();
  </script>
</body>
</html>
